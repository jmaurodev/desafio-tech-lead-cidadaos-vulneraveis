version: 2

models:
  - name: mart_adm_central_atendimento_1746_kpi_geral
    description: "KPIs globais pré-agregados para o card de topo do dashboard."
    columns:
      - name: total_chamados
        description: "Total de chamados no período."
      - name: total_encerrados
        description: "Total de chamados encerrados."
      - name: total_no_prazo
        description: "Total encerrados dentro do SLA."
      - name: total_fora_prazo
        description: "Total encerrados fora do SLA."
      - name: total_em_andamento
        description: "Total de chamados ainda em aberto."
      - name: tempo_medio_resolucao_dias
        description: "Tempo médio de resolução em dias (apenas chamados encerrados)."
      - name: taxa_resolucao_prazo
        description: "Percentual de chamados encerrados dentro do SLA."
      - name: data_mais_antiga
        description: "Data de abertura do chamado mais antigo no período."
      - name: data_mais_recente
        description: "Data de abertura do chamado mais recente no período."
