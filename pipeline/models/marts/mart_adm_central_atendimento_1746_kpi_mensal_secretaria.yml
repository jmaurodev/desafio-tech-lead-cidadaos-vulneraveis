version: 2

models:
  - name: mart_adm_central_atendimento_1746_kpi_mensal_secretaria
    description: >
      Agregado de grão fino (ano_mes × secretaria) com medidas aditivas.
      Fonte única do dashboard: a API faz rollup desta tabela para qualquer
      janela do slider. Métricas não-aditivas são derivadas dos componentes
      (soma_duracao_encerrados, total_encerrados). Ver docs/decisoes.md.
    columns:
      - name: ano_mes
        description: "Ano-mês YYYY-MM da abertura."
        tests:
          - not_null
      - name: secretaria
        description: "Secretaria/órgão responsável (limpeza 2)."
        tests:
          - not_null
      - name: total_chamados
        description: "Total de chamados no mês/secretaria."
      - name: total_encerrados
        description: "Encerrados (data_fim não nula)."
      - name: total_no_prazo
        description: "Encerrados dentro do SLA."
      - name: total_fora_prazo
        description: "Encerrados fora do SLA."
      - name: total_em_andamento
        description: "Não encerrados."
      - name: soma_duracao_encerrados
        description: "Soma de duracao_dias dos encerrados — componente para derivar o tempo médio em qualquer janela."
      - name: data_mais_antiga
        description: "Menor data_inicio do grupo."
      - name: data_mais_recente
        description: "Maior data_inicio do grupo."
