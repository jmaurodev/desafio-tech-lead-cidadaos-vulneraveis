version: 2

models:
  - name: mart_adm_central_atendimento_1746_kpi_mensal
    description: "KPIs agrupados por ano-mês para a série temporal do dashboard."
    columns:
      - name: ano_mes
        description: "Período YYYY-MM."
        tests:
          - not_null
          - unique
      - name: total_chamados
        description: "Total de chamados no mês."
      - name: total_encerrados
        description: "Total de chamados encerrados no mês."
      - name: total_no_prazo
        description: "Total encerrados dentro do SLA no mês."
      - name: total_fora_prazo
        description: "Total encerrados fora do SLA no mês."
      - name: total_em_andamento
        description: "Total de chamados ainda em aberto abertos neste mês."
      - name: tempo_medio_resolucao_dias
        description: "Tempo médio de resolução em dias no mês."
      - name: taxa_resolucao_prazo
        description: "Percentual de chamados encerrados dentro do SLA no mês."
