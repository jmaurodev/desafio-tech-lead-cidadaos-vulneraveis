version: 2

models:
  - name: int_adm_central_atendimento_1746_chamado
    description: "Chamados com campos calculados: duração em dias, flag de cumprimento de prazo e ano-mês."
    columns:
      - name: id_chamado
        description: "Identificador único do chamado."
        tests:
          - not_null
          - unique
      - name: id_bairro
        description: "Identificador do bairro da ocorrência."
      - name: nome_bairro
        description: "Nome do bairro da ocorrência."
      - name: nome_subprefeitura
        description: "Subprefeitura responsável pelo bairro."
      - name: nome_regiao_administrativa
        description: "Região administrativa do bairro."
      - name: encerrado
        description: "Indicador de encerramento derivado de data_fim (fonte da verdade — limpeza 1). True quando data_fim não é nulo."
        tests:
          - not_null
      - name: secretaria
        description: "Secretaria/órgão responsável, derivado de subtipo por palavra-chave (limpeza 2). 'indefinido' para a cauda longa não classificada (~2%)."
        tests:
          - not_null
      - name: duracao_dias
        description: "Dias entre data_inicio e data_fim (ou hoje, para chamados em aberto)."
      - name: no_prazo
        description: "True se encerrado dentro do prazo, false se atrasado, null se ainda em aberto."
      - name: ano_mes
        description: "Ano-mês de abertura no formato YYYY-MM, para agregações temporais."
        tests:
          - not_null
