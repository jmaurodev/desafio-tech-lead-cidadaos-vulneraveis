[project]
name = "chamados-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pyjwt>=2.9.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0.0",
    "bcrypt>=5.0.0",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
